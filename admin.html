<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080d0b" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f4f8f5" media="(prefers-color-scheme: light)" />
  <title>운영진 승인 | JoyGolf</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⛳%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    // 테마를 페인트 전에 확정해 깜빡임(FOUC)을 막는다.
    (function () {
      var t = "dark";
      try {
        t = localStorage.getItem("joygolf-theme") ||
          (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      } catch (e) {}
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>
  <div id="navbar"></div>

  <main class="container">
    <header class="page-head reveal">
      <span class="eyebrow">🛡️ Admin</span>
      <h1 class="page-title">운영진 승인 대기열</h1>
      <p class="subtitle">연습·스코어 인증 사진을 확인하고 승인 또는 반려하세요.</p>
    </header>

    <div id="notAdmin" class="empty-state" hidden>
      <span class="emoji">🙅</span>운영진만 접근할 수 있는 페이지예요.
    </div>

    <div id="adminContent" class="bento" hidden>
      <section class="card col-6 reveal">
        <div class="card-head">
          <span class="card-icon">🏋️</span>
          <h3 class="flex-1">연습 인증 대기</h3>
          <span class="badge badge-orange" id="practiceCount">0</span>
        </div>
        <div id="practiceQueue"></div>
        <p class="empty-state" id="practiceEmpty" hidden>
          <span class="emoji">✨</span>대기 중인 연습 인증이 없어요.
        </p>
      </section>

      <section class="card col-6 reveal">
        <div class="card-head">
          <span class="card-icon">⛳</span>
          <h3 class="flex-1">스코어 인증 대기</h3>
          <span class="badge badge-orange" id="scoreCount">0</span>
        </div>
        <div id="scoreQueue"></div>
        <p class="empty-state" id="scoreEmpty" hidden>
          <span class="emoji">✨</span>대기 중인 스코어 인증이 없어요.
        </p>
      </section>
    </div>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
