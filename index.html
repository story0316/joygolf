<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080d0b" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f4f8f5" media="(prefers-color-scheme: light)" />
  <meta name="description" content="JoyGolf — 사내 골프 동호회. 연습과 라운드를 인증하고, 육각형 역량과 레벨을 함께 키워요." />
  <title>JoyGolf | 사내 골프 동호회</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⛳%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    // 테마를 페인트 전에 확정해 깜빡임(FOUC)을 막는다.
    (function () {
      var t = "dark";
      try {
        t = localStorage.getItem("joygolf-theme") ||
          (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      } catch (e) {}
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>
  <button id="themeToggle" class="icon-btn" aria-label="테마 전환"
          style="position: fixed; top: 20px; right: 20px; z-index: 10;">🌙</button>

  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">⛳</div>
      <h1 class="auth-title">JoyGolf</h1>
      <p class="subtitle" style="margin: 0 auto;">
        연습부터 라운드까지, 우리 회사 골프 동호회의 성장 기록
      </p>

      <div class="segmented" role="tablist">
        <button class="tab-btn active" id="tabLogin" role="tab" aria-selected="true">로그인</button>
        <button class="tab-btn" id="tabSignup" role="tab" aria-selected="false">회원가입</button>
      </div>

      <form id="authForm">
        <div class="field">
          <label for="email">회사 이메일</label>
          <input type="email" id="email" required autocomplete="email" placeholder="you@company.com" />
        </div>

        <div class="field" id="nameField" hidden>
          <label for="displayName">닉네임</label>
          <input type="text" id="displayName" autocomplete="nickname" placeholder="필드에서 불릴 이름" />
        </div>

        <div class="field">
          <label for="password">비밀번호</label>
          <input type="password" id="password" required minlength="6" autocomplete="current-password" placeholder="6자 이상" />
        </div>

        <button type="submit" class="btn btn-block mt-20" id="submitBtn">로그인</button>
      </form>

      <p class="form-hint" id="formHint" role="status" aria-live="polite"></p>

      <div class="auth-features">
        <span class="badge badge-green">🏋️ 연습 인증</span>
        <span class="badge badge-green">⬡ 육각형 역량</span>
        <span class="badge badge-orange">🏆 이달의 상</span>
      </div>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
