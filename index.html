<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JoyGolf | 사내 골프 동호회</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#f4f7f4" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#070c0a" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="JoyGolf" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    // FOUC 방지: 저장된 테마를 페인트 전에 반영
    (function () {
      try {
        var t = localStorage.getItem("joygolf-theme");
        if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>

  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">🏌️</div>
      <p class="eyebrow">Company Golf Club</p>
      <h1 class="auth-title">JoyGolf</h1>
      <p class="subtitle" style="margin-top: 6px;">연습하고, 인증하고, 같이 라운딩해요 ⛳</p>

      <div class="tabs" role="tablist">
        <button class="tab-btn active" id="tabLogin" role="tab">로그인</button>
        <button class="tab-btn" id="tabSignup" role="tab">회원가입</button>
      </div>

      <form id="authForm" class="auth-form">
        <label for="email">회사 이메일</label>
        <input type="email" id="email" required placeholder="you@company.com" autocomplete="email" />

        <div id="nameField" style="display:none;">
          <label for="displayName">닉네임</label>
          <input type="text" id="displayName" placeholder="필드에서 불릴 이름" autocomplete="nickname" />
        </div>

        <label for="password">비밀번호</label>
        <input type="password" id="password" required minlength="6" placeholder="6자 이상" autocomplete="current-password" />

        <button type="submit" class="btn btn-block" style="margin-top: 22px;" id="submitBtn">로그인</button>
      </form>
      <p class="hint" id="formHint" style="margin-top: 14px; text-align: center;"></p>
    </div>
  </div>

  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
