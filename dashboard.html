<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080d0b" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f4f8f5" media="(prefers-color-scheme: light)" />
  <title>대시보드 | JoyGolf</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⛳%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    // 테마를 페인트 전에 확정해 깜빡임(FOUC)을 막는다.
    (function () {
      var t = "dark";
      try {
        t = localStorage.getItem("joygolf-theme") ||
          (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      } catch (e) {}
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>
  <div id="navbar"></div>

  <main class="container">
    <header class="page-head reveal">
      <span class="eyebrow">⛳ My Growth</span>
      <h1 class="page-title" id="greeting">오늘도 좋은 스윙 되세요</h1>
      <p class="subtitle" id="welcomeMsg"></p>
    </header>

    <div class="bento">
      <!-- 레벨 히어로 -->
      <section class="card card-feature col-7 reveal">
        <div class="level-box">
          <div class="level-ring" id="levelRing" style="--p: 0;">
            <span class="level-emoji" id="levelEmoji">🌱</span>
          </div>
          <div class="level-meta">
            <div class="row">
              <span class="badge badge-green" id="levelChip">Lv.1</span>
              <span class="level-points" id="levelPoints">0 <span class="unit">pt</span></span>
            </div>
            <div class="level-title" id="levelTitle">필드 새싹 🌱</div>
            <div class="progress-track">
              <div class="progress-fill" id="progressFill"></div>
            </div>
            <p class="hint" id="progressHint">기록을 불러오는 중…</p>
          </div>
        </div>
        <div class="stat-tiles" id="statTiles"></div>
      </section>

      <!-- 육각형 역량 -->
      <section class="card col-5 reveal">
        <div class="card-head">
          <span class="card-icon">⬡</span>
          <div class="flex-1">
            <h3>내 육각형 역량</h3>
            <p class="hint" id="radarHint">최근 6개월 인증 기록 기준</p>
          </div>
        </div>
        <div class="chart-box">
          <canvas id="radarChart" aria-label="육각형 역량 차트"></canvas>
        </div>
      </section>

      <!-- 배지 -->
      <section class="card col-4 reveal">
        <div class="card-head">
          <span class="card-icon">🎖️</span>
          <h3 class="flex-1">획득 배지</h3>
          <span class="badge badge-gray" id="badgeCount">0</span>
        </div>
        <div id="badgeList" class="stat-tiles stat-tiles-wide mt-0"></div>
        <p class="empty-state" id="badgeEmpty" hidden>
          <span class="emoji">🥚</span>아직 배지가 없어요.<br />첫 인증을 등록해보세요!
        </p>
      </section>

      <!-- 최근 활동 -->
      <section class="card col-4 reveal">
        <div class="card-head">
          <span class="card-icon">🕓</span>
          <h3 class="flex-1">최근 활동</h3>
        </div>
        <div id="recentActivity"></div>
        <p class="empty-state" id="activityEmpty" hidden>
          <span class="emoji">📭</span>아직 활동 기록이 없어요.
        </p>
      </section>

      <!-- 다가오는 모임 -->
      <section class="card col-4 reveal">
        <div class="card-head">
          <span class="card-icon">📅</span>
          <h3 class="flex-1">다가오는 모임</h3>
        </div>
        <div id="upcomingMeetups"></div>
        <p class="empty-state" id="meetupEmpty" hidden>
          <span class="emoji">🗓️</span>예정된 모임이 없어요.
        </p>
        <a href="meetup.html" class="btn btn-outline btn-sm btn-block mt-16">모임 만들기 →</a>
      </section>
    </div>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
