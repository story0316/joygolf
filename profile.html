<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>프로필 | JoyGolf</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="navbar"></div>

  <div class="container">
    <h1 class="page-title">⚙️ 내 프로필 &amp; 공개 설정</h1>

    <div class="card">
      <h3>기본 정보</h3>
      <form id="profileForm">
        <div class="form-row">
          <div>
            <label for="displayName">닉네임</label>
            <input type="text" id="displayName" required />
          </div>
          <div>
            <label for="avatarEmoji">아바타 이모지</label>
            <input type="text" id="avatarEmoji" maxlength="2" />
          </div>
        </div>
        <div class="form-row">
          <div>
            <label for="department">부서/팀 (선택)</label>
            <input type="text" id="department" />
          </div>
          <div>
            <label for="handicap">핸디캡 (선택)</label>
            <input type="number" id="handicap" step="0.1" />
          </div>
        </div>
        <button type="submit" class="btn" style="margin-top: 14px;">저장</button>
      </form>
    </div>

    <div class="card">
      <h3>🔒 공개 설정</h3>
      <p class="hint">두 가지 설정은 서로 독립적으로 동작해요.</p>

      <label style="margin-top: 16px;">1. 내 상세 기록(육각형 차트, 연습/스코어 인증 내역) 공개 범위</label>
      <select id="visibilitySelect">
        <option value="public">전체 공개 — 다른 회원이 내 기록을 볼 수 있어요</option>
        <option value="private">비공개 — 나만 볼 수 있어요</option>
      </select>
      <p class="hint">비공개로 설정해도 전체 통계(랭킹 계산)에는 익명으로 반영돼요.</p>

      <label style="margin-top: 20px;">2. 이달의 상 발표에 닉네임 노출 동의</label>
      <select id="awardVisibleSelect">
        <option value="true">동의 — 이달의 상 수상 시 닉네임이 표시돼요</option>
        <option value="false">비동의 — "이름 없는 회원"으로 표시돼요</option>
      </select>
      <p class="hint">기록은 비공개로 하고, 이달의 상만 받고 싶은 경우 1번은 비공개 / 2번은 동의로 설정하세요.</p>

      <button id="savePrivacyBtn" class="btn btn-outline" style="margin-top: 16px;">공개 설정 저장</button>
    </div>
  </div>

  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
