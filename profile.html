<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>프로필 | JoyGolf</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#f4f7f4" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#070c0a" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="JoyGolf" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("joygolf-theme");
        if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
  <div id="navbar"></div>

  <main class="container">
    <header class="page-head">
      <p class="eyebrow">⚙️ Settings</p>
      <h1 class="page-title">내 프로필 &amp; 공개 설정</h1>
    </header>

    <div class="grid-2">
      <section class="card card-accent">
        <div class="section-label"><h3>기본 정보</h3></div>
        <form id="profileForm">
          <div class="form-row">
            <div>
              <label for="displayName">닉네임</label>
              <input type="text" id="displayName" required />
            </div>
            <div>
              <label for="avatarEmoji">아바타 이모지</label>
              <input type="text" id="avatarEmoji" maxlength="2" />
            </div>
          </div>
          <div class="form-row">
            <div>
              <label for="department">부서/팀 (선택)</label>
              <input type="text" id="department" />
            </div>
            <div>
              <label for="handicap">핸디캡 (선택)</label>
              <input type="number" id="handicap" step="0.1" />
            </div>
          </div>
          <button type="submit" class="btn" style="margin-top: 18px;">저장</button>
        </form>
      </section>

      <section class="card">
        <div class="section-label"><h3>🔒 공개 설정</h3></div>
        <p class="hint">두 가지 설정은 서로 독립적으로 동작해요.</p>

        <label style="margin-top: 18px;">1. 내 상세 기록(육각형 차트, 인증 내역) 공개 범위</label>
        <select id="visibilitySelect">
          <option value="public">전체 공개 — 다른 회원이 내 기록을 볼 수 있어요</option>
          <option value="private">비공개 — 나만 볼 수 있어요</option>
        </select>
        <p class="hint">비공개로 설정해도 전체 통계(랭킹 계산)에는 익명으로 반영돼요.</p>

        <label style="margin-top: 20px;">2. 이달의 상 발표에 닉네임 노출 동의</label>
        <select id="awardVisibleSelect">
          <option value="true">동의 — 수상 시 닉네임이 표시돼요</option>
          <option value="false">비동의 — "이름 없는 회원"으로 표시돼요</option>
        </select>
        <p class="hint">기록은 숨기고 이달의 상만 받고 싶다면 1번은 비공개 / 2번은 동의로 설정하세요.</p>

        <button id="savePrivacyBtn" class="btn btn-outline" style="margin-top: 20px;">공개 설정 저장</button>
      </section>
    </div>

    <section class="card">
      <div class="section-label">
        <h3>🔔 알림 설정</h3>
        <span class="badge badge-gray" id="pushStatus">확인 중…</span>
      </div>
      <p class="hint" id="pushDesc">
        모임 하루 전 리마인더, 인증 승인 결과, 이달의 상 발표를 푸시로 받아볼 수 있어요.
        이 기기(브라우저)에서만 적용되며, 언제든 끌 수 있습니다.
      </p>
      <div class="btn-row">
        <button id="pushEnableBtn" class="btn btn-sm">🔔 이 기기에서 알림 받기</button>
        <button id="pushDisableBtn" class="btn btn-sm btn-outline" style="display:none;">알림 끄기</button>
      </div>
    </section>
  </main>

  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/push.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
