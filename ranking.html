<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>랭킹 | JoyGolf</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("joygolf-theme");
        if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
  <div id="navbar"></div>

  <main class="container">
    <header class="page-head">
      <p class="eyebrow" id="monthLabel">이달의 시상</p>
      <h1 class="page-title"><span class="emoji">🏆</span> 이달의 상 &amp; 랭킹</h1>
      <p class="subtitle">비공개 프로필 회원도 집계에는 포함되며, 시상 노출에 동의한 경우에만 닉네임이 표시돼요. (프로필 페이지에서 변경 가능)</p>
    </header>

    <div id="awardWrap"></div>
  </main>

  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/ranking.js"></script>
</body>
</html>
