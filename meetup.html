<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080d0b" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f4f8f5" media="(prefers-color-scheme: light)" />
  <meta name="description" content="JoyGolf — 사내 골프 동호회. 연습과 라운드를 인증하고, 육각형 역량과 레벨을 함께 키워요." />
  <title>모임 | JoyGolf</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="JoyGolf" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    // 테마를 페인트 전에 확정해 깜빡임(FOUC)을 막는다.
    (function () {
      var t = "dark";
      try {
        t = localStorage.getItem("joygolf-theme") ||
          (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      } catch (e) {}
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>
  <div id="navbar"></div>

  <main class="container">
    <header class="page-head reveal">
      <span class="eyebrow">📅 Meetup</span>
      <h1 class="page-title">라운딩 · 연습 모임</h1>
      <p class="subtitle">번개 라운딩이나 연습 모임을 만들고 참가 신청을 받아보세요.</p>
    </header>

    <div class="bento">
      <section class="card col-5">
        <div class="card-head">
          <span class="card-icon">➕</span>
          <h3 class="flex-1">새 모임 만들기</h3>
        </div>

        <form id="meetupForm">
          <div class="field">
            <label for="title">모임 제목</label>
            <input type="text" id="title" required placeholder="예: 토요일 오전 번개 라운딩" />
          </div>

          <div class="form-row">
            <div class="field">
              <label for="meetupType">모임 종류</label>
              <select id="meetupType">
                <option value="round">⛳ 라운딩</option>
                <option value="practice">🏋️ 연습</option>
                <option value="etc">🎉 기타</option>
              </select>
            </div>
            <div class="field">
              <label for="maxPeople">모집 인원</label>
              <input type="number" id="maxPeople" value="4" min="1" />
            </div>
          </div>

          <div class="form-row">
            <div class="field">
              <label for="meetupDate">날짜 / 시간</label>
              <input type="datetime-local" id="meetupDate" required />
            </div>
            <div class="field">
              <label for="location">장소</label>
              <input type="text" id="location" placeholder="예: OO CC" />
            </div>
          </div>

          <div class="field">
            <label for="description">설명 <span class="hint" style="display:inline">(선택)</span></label>
            <textarea id="description" rows="3" placeholder="준비물, 참가비, 만나는 시간 등"></textarea>
          </div>

          <button type="submit" class="btn btn-amber btn-block mt-16" id="submitBtn">➕ 모임 만들기</button>
        </form>
      </section>

      <section class="card col-7">
        <div class="card-head">
          <span class="card-icon">🗓️</span>
          <h3 class="flex-1">예정된 모임</h3>
          <span class="badge badge-gray" id="meetupTotal">0개</span>
        </div>
        <div id="meetupList"></div>
        <p class="empty-state" id="meetupEmpty" hidden>
          <span class="emoji">📭</span>예정된 모임이 없어요.<br />첫 모임을 만들어보세요!
        </p>
      </section>
    </div>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/meetup.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
